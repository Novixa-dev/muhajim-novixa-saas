# ==============================================================================
# muhajim.novixa.dev — site block for mailcow's nginx (HTTPS variant).
#
# MANAGED BY CI: installed to <mailcow>/data/conf/nginx/muhajim.conf by
# deploy/deploy.sh. Edit it here, not on the server.
#
# Only answers for muhajim.novixa.dev; every other site on the server keeps
# its own server blocks. Lines ending in "#ipv6" are dropped when mailcow's
# nginx has no IPv6 listener.
# ==============================================================================

server {
    listen 80;
    listen [::]:80; #ipv6
    server_name muhajim.novixa.dev;
    return 301 https://muhajim.novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl; #ipv6
    http2 on;
    server_name muhajim.novixa.dev;

    ssl_certificate     /etc/nginx/conf.d/muhajim/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/muhajim/origin.key;

    root /etc/nginx/conf.d/muhajim/current;
    index index.html;

    # Locations below use `expires` (not add_header) so these stay inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.google.com https://*.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.google.com https://*.googlesyndication.com; connect-src 'self' https://*.google.com https://*.googlesyndication.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
