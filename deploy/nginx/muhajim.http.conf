# ==============================================================================
# muhajim.novixa.dev — site block for mailcow's nginx (HTTP-only fallback).
#
# MANAGED BY CI: used by deploy/deploy.sh only while no origin certificate is
# available in <mailcow>/data/conf/nginx/muhajim/. Edit it here, not on the
# server. Lines ending in "#ipv6" are dropped when mailcow's nginx has no IPv6
# listener.
# ==============================================================================

server {
    listen 80;
    listen [::]:80; #ipv6
    server_name muhajim.novixa.dev;

    root /etc/nginx/conf.d/muhajim/current;
    index index.html;

    # Locations below use `expires` (not add_header) so these stay inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.google.com https://*.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.google.com https://*.googlesyndication.com; connect-src 'self' https://*.google.com https://*.googlesyndication.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
