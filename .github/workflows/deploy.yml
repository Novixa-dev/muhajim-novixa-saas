name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: muhajim.novixa.dev
  APP_DIR: /var/www/muhajim.novixa.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # One-time server setup (idempotent): nginx, web root, site config.
      - name: Prepare server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOMAIN: ${{ env.DOMAIN }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: DOMAIN,APP_DIR
          script: |
            set -e
            if ! command -v nginx >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -y
              apt-get install -y nginx rsync certbot python3-certbot-nginx
              systemctl enable --now nginx
            fi
            command -v rsync >/dev/null 2>&1 || apt-get install -y rsync

            mkdir -p "$APP_DIR/html" "$APP_DIR/incoming"
            rm -rf "$APP_DIR/incoming"/*

            CONF="/etc/nginx/sites-available/$DOMAIN"
            # Only written once so certbot's later HTTPS edits are preserved.
            if [ ! -f "$CONF" ]; then
              cat > "$CONF" <<NGINX
            server {
                listen 80;
                listen [::]:80;
                server_name $DOMAIN;

                root $APP_DIR/html;
                index index.html;

                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;

                gzip on;
                gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

                location /assets/ {
                    expires 1y;
                    add_header Cache-Control "public, max-age=31536000, immutable";
                    try_files \$uri =404;
                }

                location = /index.html {
                    add_header Cache-Control "no-cache";
                    add_header X-Content-Type-Options "nosniff" always;
                    add_header X-Frame-Options "DENY" always;
                    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                }

                location / {
                    try_files \$uri \$uri.html \$uri/ /index.html;
                }
            }
            NGINX
              ln -sf "$CONF" "/etc/nginx/sites-enabled/$DOMAIN"
            fi

      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: dist
          target: ${{ env.APP_DIR }}/incoming
          strip_components: 1

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOMAIN: ${{ env.DOMAIN }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: DOMAIN,APP_DIR
          script: |
            set -e
            test -f "$APP_DIR/incoming/index.html"
            rsync -a --delete "$APP_DIR/incoming/" "$APP_DIR/html/"
            rm -rf "$APP_DIR/incoming"
            chown -R www-data:www-data "$APP_DIR/html"
            nginx -t
            systemctl reload nginx

            # Issue an HTTPS certificate once (non-fatal: DNS is behind Cloudflare).
            if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
              certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos \
                --register-unsafely-without-email --redirect || echo "certbot skipped"
            fi
