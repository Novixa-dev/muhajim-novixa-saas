name: Deploy to VPS

# The VPS also runs mailcow and other sites behind mailcow's nginx. This
# workflow only uploads a release bundle and runs deploy/deploy.sh, which
# touches nothing but muhajim.conf and the muhajim/ folder in mailcow's nginx
# config and rolls back if `nginx -t` fails.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ github.run_number }}-${{ github.sha }}
  RUN_DIR: /tmp/muhajim-release-${{ github.run_id }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package release
        run: |
          mkdir -p bundle
          cp -R dist bundle/site
          cp -R deploy bundle/deploy
          tar -czf muhajim-release.tar.gz -C bundle .

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: muhajim-release.tar.gz
          target: ${{ env.RUN_DIR }}

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          RUN_DIR: ${{ env.RUN_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: RELEASE_ID,RUN_DIR
          script: |
            cd "$RUN_DIR" && tar -xzf muhajim-release.tar.gz \
              && bash deploy/deploy.sh "$RELEASE_ID"
            status=$?
            rm -rf "$RUN_DIR"
            exit $status
